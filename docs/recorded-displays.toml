# Numark NS6 multi-segment displays, recorded with `ns6 bars blocks`.
# Send every number in `numbers` at `value` to show what is described.
#
# These are not in ns6-leds.toml because the walk that produced that file
# could not see them: it sends one message at a time, and one message to a
# bar or a ring lights a single segment.
#
# `value` is not a brightness. What it means differs per display and has
# to be recorded, not assumed: the FX rings and the Serato bar light the
# single LED at position `value`, while the strip search fills `value` of
# its fifteen. Either way 127 is out of range, which is why a sweep at 127
# found none of them.

[[display]]
description = "nothing"
channel = 0
kind = "cc"
numbers = [31, 32, 33, 34, 35, 36, 37, 38]
value = 69

[[display]]
description = "nothing"
channel = 0
kind = "cc"
numbers = [59, 62, 63, 64, 65, 66, 67, 78]
value = 43

